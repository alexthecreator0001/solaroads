<style>
  .fdb *{transform-origin:0 0}
  .fdb .fdb-tile{transform-origin:100px 100px;animation:fdb-pop .55s cubic-bezier(.22,1,.36,1) both}
  .fdb-in{animation:fdb-in .8s cubic-bezier(.16,1,.3,1) both}
  .fdb-str{animation:fdb-str .8s cubic-bezier(.16,1,.3,1) both}
  .fdb-bob{animation:fdb-bob 3s ease-in-out infinite both}
  .fdb-str2{animation:fdb-str2 3s ease-in-out infinite both}
  .fdb-o{animation-delay:.15s}
  .fdb-g{animation-delay:.3s}
  .fdb-bob.fdb-o,.fdb-str2.fdb-o{animation-delay:1.1s}
  .fdb-bob.fdb-g,.fdb-str2.fdb-g{animation-delay:1.6s}
  @keyframes fdb-pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  @keyframes fdb-in{from{transform:translate(-159px,84px)}to{transform:none}}
  @keyframes fdb-str{from{transform:scaleX(4)}to{transform:none}}
  @keyframes fdb-bob{0%,100%{transform:none}50%{transform:translate(2.65px,-1.4px)}}
  @keyframes fdb-str2{0%,100%{transform:none}50%{transform:scaleX(1.3)}}
  .fdb-word{animation:fdb-word .8s cubic-bezier(.16,1,.3,1) both}
  .fdb-w1{animation-delay:.7s}
  .fdb-w2{animation-delay:.85s}
  @keyframes fdb-word{from{transform:translateX(-70px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.fdb *{animation:none!important}}
</style>
