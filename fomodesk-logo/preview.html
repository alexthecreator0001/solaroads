<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FomoDesk animated logo</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
  section { display: flex; flex-wrap: wrap; align-items: center; gap: 48px; padding: 48px 32px; }
  .light { background: #fff; }
  .dark { background: #000; }
  .icon { width: 160px; height: 160px; }
  .logo { width: min(560px, 100%); height: auto; }
  button { position: fixed; top: 16px; right: 16px; padding: 8px 16px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<button onclick="replay()">Replay</button>
<section class="light">
  <img class="icon" src="fomodesk-icon-animated.svg" alt="FomoDesk icon">
  <img class="logo" src="fomodesk-logo-animated-black.svg" alt="FomoDesk">
</section>
<section class="dark">
  <img class="icon" src="fomodesk-icon-animated.svg" alt="FomoDesk icon">
  <img class="logo" src="fomodesk-logo-animated-white.svg" alt="FomoDesk">
</section>
<script>
  function replay() {
    for (const img of document.images) img.src = img.src.split('?')[0] + '?' + Date.now();
  }
</script>
</body>
</html>
